<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Protected CMS for Mohammad Sameer's portfolio.">
    <title>CMS | Mohammad Sameer</title>
    <script>
      // Site is dark-only ("Glass & Void"); force dark to avoid an unstyled light flash.
        document.documentElement.dataset.theme = "dark";
    </script>
  </head>
  <body>

    <div id="globalLoader" class="global-loader">
      <div class="loader-spinner"></div>
    </div>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('globalLoader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        }
      });
    </script>

    <div class="app-shell">
      <header class="site-header" data-site-header></header>
      <main id="cms-root"></main>
      <footer class="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="../src/cms.js"></script>
  </body>
</html>
