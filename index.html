<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mohammad Sameer portfolio: AI/ML, Generative AI, projects, certificates, blog, LinkedIn highlights, and focus tools.">
    <title>Mohammad Sameer | AI/ML Research OS</title>
    <script>
      (() => {
        const stored = localStorage.getItem("sameer-theme");
        const theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header" data-site-header></header>
      <main id="home-root"></main>
      <footer class="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
