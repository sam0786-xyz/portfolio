<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI/ML and Generative AI blog by Mohammad Sameer.">
    <title>Blog | Mohammad Sameer</title>
    <link rel="canonical" href="https://sam18.xyz/blog/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Blog | Mohammad Sameer">
    <meta property="og:description" content="Field notes on AI/ML, Generative AI, RAG, and building production systems by Mohammad Sameer.">
    <meta property="og:url" content="https://sam18.xyz/blog/">
    <meta property="og:image" content="https://sam18.xyz/assets/neural-console.png">
    <meta name="twitter:card" content="summary_large_image">
    <script>
      (() => {
        const stored = localStorage.getItem("sameer-theme");
        const theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/v3.css">
  </head>
  <body>

    <div id="globalLoader" class="global-loader">
      <div class="loader-spinner"></div>
    </div>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('globalLoader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        }
      });
    </script>

    <div class="app-shell">
      <header class="site-header" data-site-header></header>
      <main id="blog-root"></main>
      <footer class="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/blog.js"></script>
  </body>
</html>
