<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Protected admin writing studio for Mohammad Sameer's portfolio.">
    <title>Studio | Mohammad Sameer</title>
    <script>
      (() => {
        const stored = localStorage.getItem("sameer-theme");
        const theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>

    <div id="globalLoader" class="global-loader">
      <div class="loader-spinner"></div>
    </div>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('globalLoader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        }
      });
    </script>

    <div class="app-shell">
      <header class="site-header" data-site-header></header>
      <main id="studio-root"></main>
      <footer class="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/studio.js"></script>
  </body>
</html>
