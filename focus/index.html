  <body>

    <div id="globalLoader" class="global-loader" role="status" aria-live="polite" aria-label="Loading page">
      <div class="loader-spinner"></div>
    </div>
    <script>
      window.addEventListener('load', () => window.setTimeout(() => {
        if (window.__portfolioLoaderReady) return;
        const loader = document.getElementById('globalLoader');
        if (loader) { loader.classList.add('hidden'); loader.setAttribute('aria-hidden', 'true'); setTimeout(() => loader.remove(), 500); }
      }, 3000));
    </script>

    <div class="app-shell">
      <header class="site-header" data-site-header></header>
      <main id="focus-root"></main>
      <footer class="site-footer" data-site-footer></footer>
    </div>
